# HTTP server
server.port=${SERVER_PORT:8082}

# Optional local overrides. Create application-local.properties for machine-specific settings.
spring.config.import=optional:classpath:application-local.properties

# PostgreSQL connection
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:}}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database schema is managed by sql/qgchat_schema.sql.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Session and password reset token lifetime
qgchat.auth.token-ttl-hours=${QGCHAT_AUTH_TOKEN_TTL_HOURS:12}
qgchat.auth.password-reset-ttl-minutes=${QGCHAT_AUTH_PASSWORD_RESET_TTL_MINUTES:15}

# WebSocket origins. Use comma-separated origins for multiple frontend hosts.
qgchat.websocket.allowed-origins=${QGCHAT_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
